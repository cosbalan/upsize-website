# Decap CMS settings. Change "repo" to your GitHub username/repository name.
backend:
  name: github
  repo: cosbalan/upsize-website
  branch: main

site_url: https://www.upsizeproperty.com
display_url: https://www.upsizeproperty.com
locale: en

media_folder: src/images/news
public_folder: images/news

# Posts are saved as drafts for review before they go live
publish_mode: editorial_workflow

collections:
  - name: news
    label: News, blog and press releases
    label_singular: Post
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "news/{{slug}}"
    sortable_fields: [date, title, category]
    summary: "{{date | date('DD MMM YYYY')}} · {{category}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string, hint: "Aim for 50–65 characters and include the town or service, e.g. 'Flat roof replacement in Spalding'" }
      - { label: Category, name: category, widget: select, options: ["Blog", "Press release"], default: "Blog" }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: Summary, name: summary, widget: text, hint: "One or two sentences (max 160 characters). Used by Google, AI search and the news cards." }
      - { label: Main image, name: image, widget: image, required: false }
      - { label: Image description, name: image_alt, widget: string, required: false, hint: "Describe the photo, e.g. 'New EPDM flat roof on a garage in Bourne'" }
      - { label: "Google title (optional)", name: seo_title, widget: string, required: false, hint: "Max 60 characters. Leave empty to use the title." }
      - { label: "Google description (optional)", name: seo_description, widget: string, required: false, hint: "Max 160 characters. Leave empty to use the summary." }
      - { label: Hide from website, name: draft, widget: boolean, default: false, required: false }
      - { label: Article, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote], editor_components: [image] }
